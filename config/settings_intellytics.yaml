path:
  project_root: /Workspace/Users/jungryo.lee@lge.com/prj_TV_voc
  env: /Workspace/Users/jungryo.lee@lge.com/prj_TV_voc/.env
  prompts: /Workspace/Users/jungryo.lee@lge.com/prj_TV_voc/config/prompts.yaml
  volume_base: /Volumes/sandbox/z_jungryo_lee/tv_voc
  embedding_model: /Volumes/sandbox/z_jungryo_lee/tv_voc/bge-large-en-v1.5

runtime:
  mode: test
  timezone: Asia/Seoul
  run_date: null
  run_id_prefix: tv_voc_intellytics

app:
  data_mode: table
  classification_table_key: classification_detail
  model_key: gpt_55
  target_cate_1_depth: null
  target_cate_2_depth: null
  target_sc_measurement: null
  max_review_rows: 300
  warehouse_http_path: null

unity_catalog:
  catalog: sandbox
  schema: z_jungryo_lee

source:
  raw_review_table: sandbox.t_online_voc_analysis.intellytics_display_online_voc_work
  raw_ods_table: kic_data_ods.intellytics_voc.intellytics_display_online_voc
  raw_mirror_table: sandbox.t_online_voc_analysis.intellytics_display_online_voc_raw
  final_tableau_view: sandbox.t_online_voc_analysis.intellytics_display_online_voc
  # Delta Sharing contract: new ODS columns must not change the shared view schema.
  final_tableau_source_columns:
    - country_code
    - country
    - country_kr
    - year
    - post_no
    - cate_1_depth
    - cate_2_depth
    - sentiment
    - memo
    - post_date
    - brand_name
    - model
    - inch
    - device_type
    - site
    - site_type
    - region
    - is_new_model
    - is_lifestyle
    - sc_measurement
    - review_id
    - source_id
  model_meta_table: sandbox.z_jungryo_lee.buzz_model_meta
  sentiment_source_table: sandbox.z_jungryo_lee.buzz_sc_score_dataset
  filters:
    raw_review_table:
      - is_lifestyle = 'N'
      - UPPER(TRIM(CAST(incentive_review AS STRING))) = 'N'
      - sc_measurement IS NOT NULL

reference:
  category_rule_table: sandbox.z_jungryo_lee.tv_voc_category_rule_master
  category_master_table: sandbox.z_jungryo_lee.tv_voc_category_master
  category_mapping_table: sandbox.z_jungryo_lee.intellytics_category_mapping
  taxonomy_definition_table: sandbox.z_jungryo_lee.tv_voc_taxonomy_definition
  prompt_registry_table: sandbox.z_jungryo_lee.tv_voc_prompt_registry

tables:
  outputs:
    rule_profile: sandbox.z_jungryo_lee.tv_voc_rule_profile_intellytics
    clue_keyword: sandbox.z_jungryo_lee.tv_voc_clue_keyword_intellytics
    topic_pool: sandbox.z_jungryo_lee.tv_voc_topic_pool_intellytics
    topic_group: sandbox.z_jungryo_lee.tv_voc_topic_group_intellytics
    # Operational lifecycle tables. Tableau's shared view keeps its schema and
    # only resolves the existing pred_topic/topic_group values through these.
    topic_monthly_health: sandbox.z_jungryo_lee.tv_voc_topic_monthly_health_intellytics
    topic_active_mapping: sandbox.z_jungryo_lee.tv_voc_topic_active_mapping_intellytics
    topic_new_candidate: sandbox.z_jungryo_lee.tv_voc_topic_new_candidate_intellytics
    classification_detail: sandbox.z_jungryo_lee.tv_voc_classification_detail_intellytics
    classification_full: sandbox.z_jungryo_lee.tv_voc_classification_full_intellytics
    classification_summary: sandbox.z_jungryo_lee.tv_voc_classification_summary_intellytics
    classification_detail_final: sandbox.z_jungryo_lee.tv_voc_classification_detail_final_intellytics
    # Legacy physical exports retained for historical reference. Tableau uses
    # source.final_tableau_view, which preserves every ODS row.
    classification_tableau_final: sandbox.z_jungryo_lee.tv_voc_classification_tableau_final_intellytics
    classification_tableau_grouped_final: sandbox.z_jungryo_lee.tv_voc_classification_tableau_grouped_final_intellytics
    review_decision: sandbox.z_jungryo_lee.tv_voc_review_decision_intellytics
    topic_pool_revision: sandbox.z_jungryo_lee.tv_voc_topic_pool_revision_intellytics
    memo_embedding: sandbox.z_jungryo_lee.tv_voc_memo_embedding_intellytics
    memo_embedding_unclassified: sandbox.z_jungryo_lee.tv_voc_memo_embedding_unclassified_intellytics
    topic_prototype: sandbox.z_jungryo_lee.tv_voc_topic_prototype_intellytics
    ml_classification_detail: sandbox.z_jungryo_lee.tv_voc_ml_classification_detail_intellytics
    llm_fallback_queue: sandbox.z_jungryo_lee.tv_voc_llm_fallback_queue_intellytics
    driver_input: sandbox.z_jungryo_lee.tv_voc_driver_input_intellytics
    weighted_corr: sandbox.z_jungryo_lee.tv_voc_weighted_corr_intellytics
    weighted_regression: sandbox.z_jungryo_lee.tv_voc_weighted_regression_intellytics
    weighted_regression_model: sandbox.z_jungryo_lee.tv_voc_weighted_regression_model_intellytics
    weighted_network_edges: sandbox.z_jungryo_lee.tv_voc_weighted_network_edges_intellytics
    driver_selection: sandbox.z_jungryo_lee.tv_voc_driver_selection_intellytics
    driver_ai_insight: sandbox.z_jungryo_lee.tv_voc_driver_ai_insight_intellytics
    # Tableau AI card marts. Insight combines confidence, summary, and implication.
    driver_card_insight: sandbox.z_jungryo_lee.tv_voc_driver_card_insight_intellytics
    driver_card_driver: sandbox.z_jungryo_lee.tv_voc_driver_card_driver_intellytics
    driver_card_generation_log: sandbox.z_jungryo_lee.tv_voc_driver_card_generation_log_intellytics
    ai_insight: sandbox.z_jungryo_lee.tv_voc_ai_insight_intellytics
    dashboard_export: sandbox.z_jungryo_lee.tv_voc_dashboard_export_intellytics

  logs:
    pipeline_progress: sandbox.z_jungryo_lee.tv_voc_pipeline_progress_intellytics
    pipeline_failed: sandbox.z_jungryo_lee.tv_voc_pipeline_failed_intellytics
    pipeline_run_log: sandbox.z_jungryo_lee.tv_voc_pipeline_run_log_intellytics

llm:
  provider: databricks
  default_model_key: sonnet_46
  max_retries: 3
  backoff_base: 1.8
  timeout_seconds: 60

  models:
    sonnet_46:
      endpoint: databricks-claude-sonnet-4-6
      model_version: claude-sonnet-4-6
      inference:
        temperature: 0.0
        max_tokens: 2200

    opus_45:
      endpoint: databricks-claude-opus-4-5
      model_version: claude-opus-4-5
      inference:
        temperature: 0.0
        max_tokens: 2200

    gpt_55:
      endpoint: databricks-gpt-5-5
      model_version: gpt-5-5
      inference:
        max_tokens: 2200

    gpt_mini:
      endpoint: databricks-gpt-5-4-mini
      model_version: gpt-5-4-mini
      inference:
        max_tokens: 1400

version:
  prompt_version: v1_intellytics_non_lifestyle
  taxonomy_version: v1_intellytics_non_lifestyle
  model_version: claude-sonnet-4
  pipeline_version: v1_intellytics_non_lifestyle

driver_ai_insight:
  output_table_key: driver_ai_insight
  default_model_key: sonnet_46
  executive_model_key: opus_45
  prompt_version: v4_driver_dashboard_executive
  min_y_obs: 30
  min_adj_r_squared: 0.30
  max_prob_f: 0.05
  min_abs_coef: 0.10
  min_abs_weighted_corr: 0.30
  max_coef_p_value: 0.05
  max_models_in_context: 3
  max_drivers_in_context: 3
  max_correlations_in_context: 3
  max_group_keys_in_context: 10

driver_dashboard_cards:
  model_key: sonnet_46
  prompt_version: v2_staged_driver_dashboard_cards
  min_y_obs: 30
  min_adj_r_squared: 0.30
  max_model_p_value: 0.05
  max_condition_number: 30
  min_abs_coef: 0.10
  max_coef_p_value: 0.05
  min_abs_weighted_corr: 0.30
  max_items_per_card: 3
  reuse_unchanged: true

metadata_columns:
  run_id: run_id
  run_date: run_date
  pipeline_stage: pipeline_stage
  prompt_version: prompt_version
  taxonomy_version: taxonomy_version
  model_version: model_version
  pipeline_version: pipeline_version
  source_period_start: source_period_start
  source_period_end: source_period_end
  is_latest: is_latest
  created_at: created_at
  created_by: created_by

taxonomy:
  target_sentiments: [1, -1]
  exclude_category_prefix: "***"
  min_group_size: 100
  max_sample_rows: 1000
  max_rule_sample_rows: 800
  min_final_topics: 7
  max_final_topics: 17
  include_overall_category: true
  review_required_default: true
  category_alias_rules:
    - name: smart_features_additional_features
      enabled: true
      cate_1_depth: Smart Features & User Experience (UX)
      source_cate_2_depths:
        - Accessibility Features
        - Ambient & Gallery Mode
        - Multi View & Screen Split
        - Program Guide (EPG)
        - Recording & Utility Features
      target_cate_2_depth: Accessibility Features
      reason: cate_2_depth_kor 부가 기능 통합 운영

rule_profile:
  enabled: true
  resume_from_checkpoint: true
  limit_group_count: null
  prompt_key: rule_profile_system
  output_json_schema: rule_profile_v1
  prompt_compact_mode: true
  compact_feature_hint_max_items: 32
  compact_seed_max_items: 12
  max_prompt_memos_default: 200
  max_prompt_memos_by_model:
    sonnet_46: 200
    gpt_55: 200

topic_pool:
  enabled: true
  prompt_key: topic_pool_system
  output_json_schema: topic_pool_v1
  prompt_compact_mode: true
  compact_feature_hint_max_items: 20
  compact_rule_term_max_items: 20
  compact_non_overall_example_max_items: 6
  emergency_retry_enabled: true
  emergency_feature_hint_max_items: 10
  emergency_rule_term_max_items: 10
  emergency_non_overall_example_max_items: 3
  fallback_model_on_json_parse_error: true
  fallback_model_key: gpt_mini
  max_prompt_memos_default: 200
  max_prompt_memos_by_model:
    sonnet_46: 200
    gpt_55: 200
  raise_on_invalid_topic_count: true
  topic_count_overrides:
    "07. 스마트 사용성||07-01. 채널/컨텐츠 APP":
      min_final_topics: 8
      max_final_topics: 18
    "07. 스마트 사용성||07-03. 메뉴 구성/UI":
      min_final_topics: 8
      max_final_topics: 18
    "07. 스마트 사용성||07-04. SW/OS":
      min_final_topics: 8
      max_final_topics: 18
    "07. 스마트 사용성||07-06. 리모컨 사용성":
      min_final_topics: 8
      max_final_topics: 18
    "07. 스마트 사용성||07-08. 음성 인식/조작":
      min_final_topics: 8
      max_final_topics: 18
    "07. 스마트 사용성||07-05. 컨텐츠 탐색 사용성":
      min_final_topics: 6
      max_final_topics: 14
    "07. 스마트 사용성||07-09. 게임 기능":
      min_final_topics: 6
      max_final_topics: 14
    "07. 스마트 사용성||07-11. 홈 IoT":
      min_final_topics: 6
      max_final_topics: 14
    "07. 스마트 사용성||07-12. 모바일 연동":
      min_final_topics: 6
      max_final_topics: 14
    "01. 사이즈||01-01. TV 사이즈":
      min_final_topics: 4
      max_final_topics: 8
    "09. 친환경||09-01. 에너지 효율":
      min_final_topics: 4
      max_final_topics: 8
    "10. 가격||10-01. 가격/가격대비 가치":
      min_final_topics: 4
      max_final_topics: 8
    "11. 브랜드||11-01. 브랜드":
      min_final_topics: 4
      max_final_topics: 8
    "13. 전반적 평가||13-01. 전반적 평가":
      min_final_topics: 4
      max_final_topics: 8

topic_group:
  enabled: true
  input_table_key: topic_pool
  output_table_key: topic_group
  model_key: gpt_55
  min_groups: 3
  max_groups: 5
  special_group_name: 기타
  special_topic_types: [overall, others, llm_fallback]

classification:
  enabled: false
  prompt_key: topic_classification_system
  max_sample_rows_per_group: 1000
  dedupe_before_sample: true
  classify_batch_size: 25
  memo_summarize_threshold: 200
  summarize_batch_size: 20
  sparse_topic_min_rows: 10
  refinement_input_table_key: classification_full
  refinement_max_analysis_memos_per_group: 300
  refinement_existing_topic_min_score: 0.8
  refinement_existing_topic_min_margin: 0.0
  refinement_new_topic_candidate_min_count: 5
  refinement_new_topic_candidate_min_distinct_memo_ids: 3
  refinement_new_topic_candidate_min_ratio: 0.02
  refinement_max_candidate_rows: 200

memo_embedding:
  enabled: true
  input_table_key: classification_detail_final
  output_table_key: memo_embedding
  embedding_model: databricks-bge-large-en
  model_path: /Volumes/sandbox/z_jungryo_lee/tv_voc/bge-large-en-v1.5
  batch_size: 64
  heuristic_label_min_confidence_score: 0.6
  ml_auto_label_min_confidence_score: 0.9
  ml_auto_label_min_similarity_margin: 0.05
  include_pred_topic_types: [topic]
  exclude_review_needed: true
  text_col: memo_norm

taxonomy_lifecycle:
  enabled: true
  health_table_key: topic_monthly_health
  active_mapping_table_key: topic_active_mapping
  new_candidate_table_key: topic_new_candidate
  min_group_labeled_memo_count: 2000
  others_ratio_threshold: 0.15
  low_topic_share_threshold: 0.01
  low_topic_consecutive_months: 2
  new_topic_candidate_min_distinct_memo_ids: 50
  protected_topics: []

topic_prototype:
  enabled: true
  input_table_key: memo_embedding
  output_table_key: topic_prototype
  embedding_model: databricks-bge-large-en
  min_topic_memo_count: 3
  auto_accept_threshold: 0.82
  llm_fallback_threshold: 0.70
  top_k: 3

ml_classification:
  enabled: true
  source_table_key: raw_review_table
  labeled_embedding_table_key: memo_embedding
  query_embedding_table_key: memo_embedding_unclassified
  prototype_table_key: topic_prototype
  output_table_key: ml_classification_detail
  llm_fallback_queue_table_key: llm_fallback_queue
  final_classification_table_key: classification_detail_final
  embedding_model: databricks-bge-large-en
  taxonomy_design_model_key: gpt_55
  fallback_model_key: gpt_mini
  auto_accept_threshold: 0.80
  llm_fallback_threshold: 0.00
  min_prototype_memo_count: 3
  exclude_existing_classification: true
  exclude_existing_final_classification: true
  target_sentiments: [1, -1]
  text_col: memo_norm
  limit_rows: null
  limit_rows_per_group: 200

driver_analysis:
  enabled: false
  source_table_key: raw_review_table
  apply_source_filters: false
  post_date_col: post_date
  post_year_col: post_year
  device_type_col: device_type
  unified_device_type_col: unified_device_type
  category_mapping_table_key: category_mapping_table
  source_value_filters:
    is_lifestyle: ["N"]
    country_code: ["BR", "DE", "KR", "US", "UK"]
    post_year: ["2024", "2025", "2026"]
    brand_name: ["SAMSUNG", "LG", "TCL"]
    unified_device_type: ["OLED", "UHD", "QNED/QLED/NANO"]
  segment_col: is_lifestyle
  segment_values: ["N"]
  target_category_filters:
    cate_1_depth: Smart Features & User Experience (UX)
  model_id_strategy: composite
  model_id_cols:
    - country_code
    - post_year
    - brand_name
    - model
  sentiment_col: sc_measurement
  sentiment_values: [-1, 0, 1]
  category_key_cols:
    - cate_2_depth_kor
  category_label_col: cate_2_depth_kor
  min_model_category_count: 1
  min_group_obs: 20
  corr_threshold: 0.1
  pvalue_max: 0.1
  abs_coef_threshold: 0.1
  weight_method: sqrt_total_count
  group_dims:
    - all
    - country_code
    - brand_name
    - post_year
    - unified_device_type

insight:
  enabled: false
  prompt_key: ai_insight_system
  max_drivers_per_key_full: 4
  max_drivers_per_key_compact: 3
  max_diff_stats_full: 10

final_classification:
  include_sample_classification: true
  low_volume_group_max_raw_rows: 100
  low_volume_unclassified_topic: 미분류(리뷰 100개미만)

pipeline:
  overwrite_output: false
  save_failed_rows: true
  save_progress: true
  run_sample_classification_in_design_batch: false
  sample_classification_model_key: gpt_mini
  max_failed_group_retries: 2
  reset_failed_checkpoint_rows: false
  require_human_review_for_new_category: true
  latest_flag_strategy: true
